<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marginalia</title>
<meta name="description" content="A personal reading log and reader.">
<meta name="theme-color" content="#eceff3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11151d" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Marginalia">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Spectral:ital,wght@0,400;0,500;1,400&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one narrow reading column; library -> text view (sections ledger, notes) -> reader (book typography, page markers, select-to-passage); forms in a bottom sheet. */
:root {
  --paper: #eceff3;
  --sheet: #fbfcfd;
  --ink: #1b2231;
  --muted: #5b6476;
  --rule: #d3d9e2;
  --accent: #2c4ca3;
  --accent-ink: #ffffff;
  --mark: rgba(240, 214, 74, 0.55);
  --warn: #a5402c;
  --veil: rgba(10, 14, 22, 0.45);
  --ledge: #cdd3dc;
  --ledge-lip: #b2bac7;
  --shelf-shade: rgba(27, 34, 49, 0.14);
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --f-text: "Spectral", Georgia, "Times New Roman", serif;
  --f-ui: "Work Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #11151d; --sheet: #191f2a; --ink: #e2e6ed; --muted: #97a1b3; --rule: #2a3241;
    --accent: #93aaee; --accent-ink: #0f1420; --mark: rgba(214, 186, 52, 0.30); --warn: #e38d77; --veil: rgba(0, 0, 0, 0.6); --ledge: #283142; --ledge-lip: #1b222e; --shelf-shade: rgba(0, 0, 0, 0.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #11151d; --sheet: #191f2a; --ink: #e2e6ed; --muted: #97a1b3; --rule: #2a3241;
  --accent: #93aaee; --accent-ink: #0f1420; --mark: rgba(214, 186, 52, 0.30); --warn: #e38d77; --veil: rgba(0, 0, 0, 0.6); --ledge: #283142; --ledge-lip: #1b222e; --shelf-shade: rgba(0, 0, 0, 0.35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); background: var(--paper); }
body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.5 var(--f-ui); }
[hidden] { display: none !important; }
img { max-width: 100%; }
.wrap { max-width: 680px; margin: 0 auto; padding-inline: 16px; padding-block: 18px 96px; display: grid; gap: 22px; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { opacity: 0.55; cursor: default; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }

.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.mark-word { font: 700 30px/1 var(--f-display); letter-spacing: -0.01em; }
.mark-word span { background: linear-gradient(transparent 55%, var(--mark) 55%); padding-inline: 2px; }
.sub { color: var(--muted); font-size: 13px; }
.btn { border: 1px solid var(--rule); background: var(--sheet); border-radius: 999px; padding: 7px 14px; font-weight: 500; font-size: 14px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--warn); }
.btn.danger.armed { background: var(--warn); color: var(--sheet); border-color: var(--warn); }
.btn.ghost { background: transparent; border-color: transparent; padding-inline: 8px; color: var(--muted); }
.search { width: 100%; border: 1px solid var(--rule); background: var(--sheet); border-radius: var(--r); padding: 10px 12px; }

.banner { border: 1px dashed var(--rule); border-radius: var(--r); padding: 10px 12px; color: var(--muted); font-size: 13px; }
.label { font: 600 11px/1 var(--f-ui); letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); }
.group { display: grid; gap: 10px; }
.list { display: grid; gap: 8px; }
.hint { font-size: 12px; color: var(--muted); margin: 0; }
.hint.bad { color: var(--warn); }

.textrow { display: grid; gap: 8px; text-align: left; width: 100%; background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r); padding: 14px; }
.textrow h3 { font: 500 19px/1.25 var(--f-text); }
.byline { color: var(--muted); font-size: 13px; }
.ledger { display: flex; gap: 3px; }
.ledger i { flex: 1; height: 6px; border-radius: 2px; background: var(--rule); }
.ledger i.on { background: var(--accent); }
.rowfoot { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font: 12px var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }

.chip { display: inline-flex; align-items: center; gap: 4px; font: 500 11px/1 var(--f-ui); letter-spacing: 0.06em; text-transform: uppercase; border: 1px solid var(--rule); border-radius: 999px; padding: 4px 8px; color: var(--muted); background: transparent; }
.chip.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.chip.k-objection { color: var(--warn); border-color: currentColor; }
.chip.k-question { color: var(--accent); border-color: currentColor; }
.chip.ex { border-style: dashed; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }

/* bookshelf */
.shelf { display: grid; gap: 12px; }
.shelfrow {
  --cw: 104px;
  display: flex; gap: 16px; overflow-x: auto; overscroll-behavior-x: contain;
  margin-inline: -16px; padding: 4px 16px 6px; scroll-padding-inline: 16px; scroll-snap-type: x proximity; scrollbar-width: none;
  background:
    linear-gradient(var(--ledge), var(--ledge)) 0 calc(4px + var(--cw) * 1.5) / 100% 8px no-repeat,
    linear-gradient(var(--ledge-lip), var(--ledge-lip)) 0 calc(12px + var(--cw) * 1.5) / 100% 3px no-repeat,
    linear-gradient(var(--shelf-shade), transparent) 0 calc(15px + var(--cw) * 1.5) / 100% 10px no-repeat;
}
.shelfrow::-webkit-scrollbar { display: none; }
.shelfbook { flex: 0 0 var(--cw); width: var(--cw); display: grid; gap: 4px; align-content: start; text-align: left; background: none; border: 0; padding: 0; color: inherit; scroll-snap-align: start; }
.shelfbook .cover { margin-bottom: 18px; }
.sb-title { font: 500 13px/1.3 var(--f-ui); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 2.6em; overflow-wrap: anywhere; }
.sb-meta { font: 11px/1.3 var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; min-height: 1.3em; }
.sb-prog { display: block; height: 3px; border-radius: 2px; background: var(--rule); overflow: hidden; }
.sb-prog i { display: block; height: 100%; background: var(--accent); }

/* covers: a photo, or a cloth binding with the title stamped on */
.cover { position: relative; display: block; width: 100%; aspect-ratio: 2 / 3; container-type: inline-size; border-radius: 2px 4px 4px 2px; overflow: hidden; background: var(--rule); box-shadow: 0 1px 1px rgba(0, 0, 0, 0.14), 0 8px 14px -8px rgba(0, 0, 0, 0.5); }
.cover img { display: block; width: 100%; height: 100%; object-fit: cover; }
.cover::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(90deg, rgba(0, 0, 0, 0.3) 0, rgba(255, 255, 255, 0.16) 3%, rgba(0, 0, 0, 0.08) 6%, transparent 12%); }
.cover.gen { background: var(--cloth); color: #f1ead9; }
.cover.gen .gen-in { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: space-between; gap: 6cqw; padding: 15cqw 10cqw 13cqw 16cqw; }
.cover.gen .gt { font: 500 12.5cqw/1.18 var(--f-text); display: -webkit-box; -webkit-line-clamp: 6; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; text-wrap: balance; }
.cover.gen .gt::after { content: ""; display: block; width: 32%; height: 1px; margin-top: 7cqw; background: currentColor; opacity: 0.55; }
.cover.gen .ga { font: 600 7cqw/1.25 var(--f-ui); letter-spacing: 0.07em; text-transform: uppercase; opacity: 0.82; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

.head { display: grid; gap: 6px; }
.headrow { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 14px; align-items: end; }
.headtext { display: grid; gap: 6px; min-width: 0; }
.head h1 { font: 500 clamp(22px, 6vw, 32px)/1.15 var(--f-text); overflow-wrap: anywhere; }
.flabel { font-size: 13px; font-weight: 500; }
.coverpick { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 14px; align-items: start; }
.coverctl { display: grid; gap: 8px; justify-items: start; }
.coverctl .hint.bad { color: var(--warn); }
.head .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 4px; }
.head select { border: 1px solid var(--rule); background: var(--sheet); border-radius: 999px; padding: 6px 10px; font-size: 14px; }
.srcline { font: 12px var(--f-mono); color: var(--muted); }

.sections { display: grid; background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r); }
.sec { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; padding: 10px 12px; border-top: 1px solid var(--rule); }
.sec:first-child { border-top: 0; }
.sec input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); }
.sec button { text-align: left; background: none; border: 0; padding: 0; min-width: 0; }
.sec.done button { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--rule); }
.sec.sel { background: color-mix(in srgb, var(--accent) 9%, transparent); }
.sec .n { font: 12px var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }

.notesbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.note { display: grid; gap: 8px; padding: 14px 0; border-top: 1px solid var(--rule); min-width: 0; }
.note:first-child { border-top: 0; padding-top: 4px; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font: 12px var(--f-mono); color: var(--muted); }
.meta .pg { color: var(--ink); font-weight: 500; }
.passage { font: 400 17px/1.6 var(--f-text); margin: 0; overflow-wrap: anywhere; }
.passage span { background: var(--mark); box-decoration-break: clone; -webkit-box-decoration-break: clone; padding: 1px 2px; }
.gloss { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.gloss.after { padding-left: 12px; border-left: 2px solid var(--rule); }
.noteacts { display: flex; gap: 4px; flex-wrap: wrap; }
.empty { color: var(--muted); padding: 18px 0; margin: 0; }
.empty b { color: var(--ink); font-weight: 500; }
.src { font: 12px var(--f-mono); color: var(--accent); background: none; border: 0; padding: 0; text-align: left; }

.veil { position: fixed; inset: 0; background: var(--veil); display: flex; align-items: flex-end; justify-content: center; z-index: 20; }
.sheet { background: var(--sheet); width: 100%; max-width: 680px; max-height: 92%; overflow-y: auto; border-radius: 16px 16px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; }
.sheet h2 { font: 700 20px/1.2 var(--f-display); }
.field { display: grid; gap: 5px; }
.field label { font-size: 13px; font-weight: 500; }
.field input, .field select, .field textarea { border: 1px solid var(--rule); background: var(--paper); border-radius: 8px; padding: 9px 10px; width: 100%; min-width: 0; }
.drop { position: relative; display: grid; gap: 4px; justify-items: center; text-align: center; padding: 22px 14px; border: 1.5px dashed var(--rule); border-radius: var(--r); background: var(--paper); }
.drop.over, .drop:focus-within { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 7%, var(--paper)); }
.drop input[type=file] { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; padding: 0; border: 0; border-radius: var(--r); }
.drop-main { font-weight: 600; color: var(--accent); pointer-events: none; overflow-wrap: anywhere; }
.drop-sub { font-size: 12px; color: var(--muted); pointer-events: none; }
.linkbtn { justify-self: start; background: none; border: 0; padding: 2px 0; color: var(--accent); font-size: 13px; text-decoration: underline; text-underline-offset: 3px; }
.pastebox { display: grid; gap: 8px; }
.pastebox .btn { justify-self: start; }
.field textarea { resize: vertical; min-height: 84px; }
.field textarea.verbatim { font: 16px/1.55 var(--f-text); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.formacts { display: flex; justify-content: flex-end; gap: 8px; }
.err { color: var(--warn); font-size: 13px; min-height: 1em; }
@media (prefers-reduced-motion: no-preference) { .sheet { animation: rise .18s ease-out; } @keyframes rise { from { transform: translateY(24px); opacity: .6; } } }

/* reader */
.rbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; align-items: center; gap: 2px; padding: 8px 10px; background: var(--paper); border-bottom: 1px solid var(--rule); }
.rbar .btn { padding: 6px 8px; font-size: 13px; }
.rtitle { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font: 500 14px var(--f-ui); padding-inline: 4px; }
.rpg { font: 12px var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; padding-inline: 4px; }
.book { --fs: 19px; max-width: 36em; margin: 0 auto; padding-inline: 18px; padding-block: 28px 160px; font: 400 var(--fs)/1.68 var(--f-text); overflow-wrap: break-word; }
.book p { margin: 0; }
.bp { text-indent: 1.4em; }
.bp.cont, .bh + .bp, .bq + .bp, .book > .bp:first-child, .bpg:first-child + .bp { text-indent: 0; }
.bh { font-family: var(--f-display); font-weight: 700; line-height: 1.2; margin: 2.2em 0 0.9em; letter-spacing: -0.005em; }
.bh.l1 { font-size: 1.5em; }
.bh.l2 { font-size: 1.22em; }
.bh.l3, .bh.l4 { font-size: 1.04em; }
.book > .bh:first-child, .bpg:first-child + .bh { margin-top: 0.4em; }
.bq { margin: 0.7em 0 0.7em 1.3em !important; font-size: 0.92em; }
.bfn { font-size: 0.78em; line-height: 1.5; color: var(--muted); padding-left: 1em; }
.bp + .bfn, .bq + .bfn, .bh + .bfn { margin-top: 0.9em !important; padding-top: 0.5em; border-top: 1px solid var(--rule); }
.bpg { display: flex; align-items: center; gap: 8px; margin: 0.5em 0; min-height: 1em; font: 11px/1 var(--f-mono); color: var(--muted); user-select: none; -webkit-user-select: none; }
.bpg::before { content: ""; flex: 1; border-top: 1px dotted var(--rule); }
.book mark { background: var(--mark); color: inherit; cursor: pointer; box-decoration-break: clone; -webkit-box-decoration-break: clone; padding: 0 1px; }
.rload { color: var(--muted); font: 14px var(--f-ui); text-indent: 0 !important; }
.selbar { position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; padding: 12px 16px calc(14px + env(safe-area-inset-bottom, 0px)); pointer-events: none; z-index: 10; }
.selbar .btn { pointer-events: auto; box-shadow: 0 4px 18px rgba(0, 0, 0, 0.22); }
.toc { display: grid; }
.tocitem { display: flex; justify-content: space-between; gap: 12px; text-align: left; background: none; border: 0; border-top: 1px solid var(--rule); padding: 10px 0; font: 400 15px/1.35 var(--f-ui); }
.tocitem.l1 { font-weight: 600; }
.tocitem.l3, .tocitem.l4 { padding-left: 16px; color: var(--muted); font-size: 14px; }
.tocitem .tp { font: 12px var(--f-mono); color: var(--muted); white-space: nowrap; }

/* backups */
.backup { display: grid; gap: 10px; padding-top: 18px; border-top: 1px solid var(--rule); }
.backup .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.filebtn { position: relative; overflow: hidden; display: inline-flex; align-items: center; }
.filebtn input[type=file] { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); max-width: calc(100% - 32px); background: var(--ink); color: var(--paper); padding: 9px 14px; border-radius: 999px; font-size: 14px; z-index: 30; box-shadow: 0 4px 18px rgba(0, 0, 0, 0.25); }
</style>
</head>
<body>

<div class="wrap" id="main"></div>
<div id="reader" hidden>
  <header class="rbar">
    <button class="btn ghost" id="rback" aria-label="Back to the text's notes">←</button>
    <div class="rtitle" id="rtitle"></div>
    <span class="rpg" id="rpg"></span>
    <button class="btn ghost" id="rsmall" aria-label="Smaller type">A−</button>
    <button class="btn ghost" id="rbig" aria-label="Larger type">A+</button>
    <button class="btn ghost" id="rtoc">Contents</button>
  </header>
  <article class="book" id="book"></article>
</div>
<div class="selbar" id="selbar" hidden><button class="btn primary" id="selsave">Save passage</button></div>
<div id="sheetroot"></div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
const KINDS = { passage: "Passage", gloss: "Gloss", question: "Question", objection: "Objection" };
const STATUS = { reading: "Reading", queued: "Queued", finished: "Finished" };
const I0 = "\u0001", I1 = "\u0002";
const S = { texts: new Map(), notes: new Map(), content: new Map(), covers: new Map(), screen: "library", textId: null, sec: "all", kind: "all", q: "", tq: "", mode: "pending" };
const R = { tid: null, blocks: null, els: [], tops: [], dirty: true, pageAt: [], secAt: [], sig: new Map(), saved: -1, sel: null };
let idb = null;

const LIBS = {
  pdf: ["https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"],
  pdfw: ["https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"],
  zip: ["https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js", "https://cdnjs.cloudflare.com/ajax/libs/jszip/3.7.1/jszip.min.js"],
  docx: ["https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.8.0/mammoth.browser.min.js", "https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js", "https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.4.21/mammoth.browser.min.js"],
};

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const gid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const pnum = (p) => { const m = String(p || "").match(/\d+/); return m ? parseInt(m[0], 10) : Infinity; };
const plain = (x) => String(x || "").replace(/[\u0001\u0002]/g, "");
const tidy = (s) => String(s || "").replace(/\s+/g, " ").replace(/\u0001\s*\u0002/g, "").trim();
const norm = (s) => plain(s).toLowerCase().replace(/[^\p{L}\p{N}]/gu, "");
const LIG = { "ﬀ": "ff", "ﬁ": "fi", "ﬂ": "fl", "ﬃ": "ffi", "ﬄ": "ffl", "ﬅ": "st", "ﬆ": "st" };
const fixLig = (s) => s.replace(/[ﬀ-ﬆ]/g, (c) => LIG[c]).replace(/­/g, "");
const clean = (s) => tidy(fixLig(plain(s)));
const SUP = { 0: "⁰", 1: "¹", 2: "²", 3: "³", 4: "⁴", 5: "⁵", 6: "⁶", 7: "⁷", 8: "⁸", 9: "⁹" };
const toSup = (s) => s.replace(/[0-9]/g, (d) => SUP[d]);
const median = (a) => { if (!a.length) return 0; const b = [...a].sort((x, y) => x - y); return b[b.length >> 1]; };
const pct = (a, q) => { const b = [...a].sort((x, y) => x - y); return b[Math.floor(q * (b.length - 1))]; };
const wmedian = (pairs) => { const a = [...pairs].sort((x, y) => x[0] - y[0]); const tot = a.reduce((s, p) => s + p[1], 0); let acc = 0; for (const [v, w] of a) { acc += w; if (acc >= tot / 2) return v; } return a.length ? a[a.length - 1][0] : 10; };
class UErr extends Error {}

function loadScript(src) { return new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = () => rej(new Error("load")); document.head.appendChild(s); }); }
async function need(key, ok) {
  if (ok()) return;
  for (const u of LIBS[key]) { try { await loadScript(u); if (ok()) return; } catch {} }
  throw new UErr("Couldn't load the file reader. Check your connection and try again.");
}

/* ---------- store: IndexedDB on this device ---------- */
const STORES = ["texts", "notes", "content", "covers"];
function idbOpen() {

function parsePlain(src, md) {

  for (const chunk of src.split(/\n[ \t]*\n/)) {
    const lines = chunk.split("\n").map((l) => l.replace(/\s+$/, "")).filter((l) => l.trim());
    if (!lines.length) continue;
    if (md) {
      let acc = "", ak = "p";
      const fl = () => { const x = tidy(inlineMd(acc)); if (plain(x)) blocks.push({ k: ak, x }); acc = ""; ak = "p"; };
      for (const ln of lines) {

        if (h) { fl(); blocks.push({ k: "h", x: tidy(inlineMd(h[2])), l: h[1].length }); continue; }

async function parseFile(file, say) {
  const fname = file.name || "file";
  const ext = (fname.includes(".") ? fname.split(".").pop() : "").toLowerCase();
  let r;
  if (ext === "pdf") r = await parsePDF(await file.arrayBuffer(), say);
  else if (ext === "epub") r = await parseEPUB(await file.arrayBuffer(), say);
  else if (ext === "docx") r = await parseDOCX(await file.arrayBuffer(), say);
  else if (ext === "html" || ext === "htm" || ext === "xhtml") r = parseHTML(await file.text());
  else if (ext === "md" || ext === "markdown") r = { ...parsePlain(await file.text(), true), kind: "Markdown" };
  else if (ext === "txt" || ext === "text" || (file.type || "").startsWith("text/")) r = { ...parsePlain(await file.text(), false), kind: "Text" };
  else throw new UErr("This file type isn't supported. Use PDF, EPUB, Word (.docx), .txt or .md.");
  r.blocks = finalize(r.blocks);
  if (!r.blocks.some((b) => b.k !== "pg")) throw new UErr("No readable text was found in this file.");
  r.sections = makeSections(r.blocks);
  r.name = fname;
  r.pages = r.blocks.filter((b) => b.k === "pg").length;

// Consume one history entry for a step the app has already taken itself (an on-screen back button, Cancel, Save).
function histBack() {
  return new Promise((res) => {
    const done = () => { if (popWaiter === done) popWaiter = null; res(); };
    popWaiter = done; history.back(); setTimeout(done, 700);
  });
}
function showView(view, fresh) {
  if (view.screen === "reader") { openReader(view.textId, view.at); return; }
  if (S.screen === "reader") { savePos(); resetReader(); }
  S.screen = view.screen;
  if (view.textId) S.textId = view.textId;
  if (fresh && view.screen === "text") { S.sec = "all"; S.kind = "all"; S.tq = ""; }
  render();
  window.scrollTo(0, fresh ? 0 : view.y || 0);
}
function go(view) {
  NAV.stack[NAV.stack.length - 1].y = window.scrollY;
  NAV.stack.push(view);
  try { history.pushState({ mg: depth() }, ""); } catch {}
  showView(view, true);
}
function stepBack() {
  if (NAV.overlay) { $("#sheetroot").innerHTML = ""; NAV.overlay = false; return true; }
  if (NAV.stack.length > 1) { NAV.stack.pop(); showView(NAV.stack[NAV.stack.length - 1], false); return true; }
  return false;
}
async function back() { if (stepBack()) await histBack(); }
window.addEventListener("popstate", (e) => {
  if (popWaiter) { popWaiter(); return; }
  if ($("#sheetroot form[data-busy]")) { try { history.pushState({ mg: depth() }, ""); } catch {} return; } // don't abandon a save in progress
  const target = e.state && typeof e.state.mg === "number" ? e.state.mg : 0;
  for (let guard = 0; depth() > target && guard < 20; guard++) if (!stepBack()) break;
});
function openOverlay() {
  if (NAV.overlay) return;
  NAV.overlay = true;
  try { history.pushState({ mg: depth() }, ""); } catch {}
}
async function closeOverlay() { if (NAV.overlay) await back(); else $("#sheetroot").innerHTML = ""; }

/* ---------- sheets ---------- */
function openSheet(html, onSubmit, onOpen) {
  const root = $("#sheetroot");
  openOverlay();
  root.innerHTML = `<div class="veil"><form class="sheet" novalidate>${html}<div class="err" id="err"></div>
    <div class="formacts"><button type="button" class="btn" id="cancel">Cancel</button><button class="btn primary" type="submit">Save</button></div></form></div>`;
  const form = $("form", root);
  $("#cancel", root).onclick = () => closeOverlay();
  $(".veil", root).addEventListener("click", (e) => { if (e.target.classList.contains("veil") && !form.dataset.busy) closeOverlay(); });
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = $("button[type=submit]", form); btn.disabled = true; form.dataset.busy = "1";
    try {
      const out = await onSubmit(new FormData(form));
      if (typeof out === "string") { $("#err", root).textContent = out; btn.disabled = false; delete form.dataset.busy; return; }
      delete form.dataset.busy;
      await closeOverlay();
      if (typeof out === "function") out(); // e.g. open the text you just added
    }
    catch (err) { $("#err", root).textContent = err instanceof UErr ? err.message : failMsg(err); btn.disabled = false; delete form.dataset.busy; }
  });
  if (onOpen) onOpen(root);
  const first = $("input:not([type=file]), textarea, select", form); if (first && !onOpen) first.focus();
}
function openPanel(html, onPick) {
  const root = $("#sheetroot");
  openOverlay();
  root.innerHTML = `<div class="veil"><div class="sheet" role="dialog" aria-modal="true">${html}<div class="formacts"><button type="button" class="btn" id="pclose">Close</button></div></div></div>`;
  $(".veil", root).addEventListener("click", async (e) => {
    if (e.target.classList.contains("veil") || e.target.id === "pclose") { closeOverlay(); return; }
    const b = e.target.closest("button"); if (b) { await closeOverlay(); onPick(b); }
  });
}
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && $("#sheetroot").innerHTML && !$("#sheetroot form[data-busy]")) closeOverlay(); });

const fileField = () => `<div class="field">
    <label for="f-file">Load the book</label>
    <div class="drop" id="f-drop">
      <input id="f-file" type="file">
      <span class="drop-main" id="f-name">Tap to choose a file</span>
      <span class="drop-sub">PDF, EPUB, Word (.docx), .txt or .md. On a computer you can also drag the file here.</span>
    </div>
    <p class="hint" id="f-prog">The text is extracted and stored on this device only; the file itself isn't kept. Scanned PDFs need OCR first.</p>
    <button type="button" class="linkbtn" id="f-pastebtn">Or paste the text instead</button>
    <div class="pastebox" id="f-pastebox" hidden>
      <textarea id="f-paste" class="verbatim" rows="6" placeholder="Paste the text here. Leave a blank line between paragraphs."></textarea>
      <button type="button" class="btn" id="f-pasteuse">Use this text</button>
    </div>
  </div>`;
function wireFile(root, onParsed) {
  const inp = $("#f-file", root), prog = $("#f-prog", root), btn = $("button[type=submit]", root), name = $("#f-name", root), drop = $("#f-drop", root);
  const say = (m, bad) => { prog.textContent = m; prog.classList.toggle("bad", !!bad); };
  let busy = false;
  const run = async (f) => {
    if (busy) return; busy = true;
    name.textContent = f.name || "Chosen file";
    btn.disabled = true; say("Reading the file…");
    try { const r = await parseFile(f, (m) => say(m)); onParsed(r); say(summary(r)); }
    catch (e) { say(e instanceof UErr ? e.message : `Couldn't read this file (${(e && e.message) || "unknown error"}).`, true); onParsed(null); }
    btn.disabled = false; busy = false;
  };
  inp.addEventListener("change", () => { const f = inp.files && inp.files[0]; if (f) run(f); });
  inp.addEventListener("cancel", () => say("No file was chosen."));
  ["dragenter", "dragover"].forEach((ev) => drop.addEventListener(ev, () => drop.classList.add("over")));
  ["dragleave", "drop"].forEach((ev) => drop.addEventListener(ev, () => drop.classList.remove("over")));
  $("#f-pastebtn", root).addEventListener("click", () => {
    const box = $("#f-pastebox", root); box.hidden = !box.hidden;
    if (!box.hidden) $("#f-paste", root).focus();
  });
  $("#f-pasteuse", root).addEventListener("click", () => {
    const txt = $("#f-paste", root).value;
    if (txt.trim().length < 20) { say("Paste some text into the box first.", true); return; }
    run(new File([txt], "Pasted text.txt", { type: "text/plain" }));
  });
}

const coverField = (t, url) => `<div class="field">
    <span class="flabel">Cover</span>
    <div class="coverpick">
      <div class="coverprev" id="c-prev">${coverHTML(t, url)}</div>
      <div class="coverctl">
        <span class="btn filebtn">Choose image<input id="c-file" type="file" accept="image/*" aria-label="Choose a cover image"></span>
        <button type="button" class="btn ghost" id="c-remove"${url ? "" : " hidden"}>Remove cover</button>
        <p class="hint" id="c-hint">A photo or image of the cover. PDFs and EPUBs fill this in for you when you load the book.</p>
      </div>
    </div>
  </div>`;
// cover.blob: undefined = leave as is, null = remove, Blob = new cover. cover.auto = it came from the book file.
function wireCover(root, cover, getT) {
  const prev = $("#c-prev", root), rm = $("#c-remove", root), hint = $("#c-hint", root), inp = $("#c-file", root);
  let url = null;
  cover.show = (blob) => {
    if (url) { URL.revokeObjectURL(url); url = null; }
    if (blob) url = URL.createObjectURL(blob);
    const base = blob === undefined ? cover.current : url;
    prev.innerHTML = coverHTML(getT(), base);
    rm.hidden = !base;
    cover.hasImg = !!base;
  };
  cover.hasImg = !!cover.current;
  inp.addEventListener("change", async () => {
    const f = inp.files && inp.files[0]; inp.value = ""; if (!f) return;
    hint.textContent = "Preparing the image…"; hint.classList.remove("bad");
    try { cover.blob = await toCover(f); cover.auto = false; cover.show(cover.blob); hint.textContent = "New cover ready. It's saved when you tap Save."; }
    catch (e) { hint.textContent = e instanceof UErr ? e.message : "That image couldn't be opened. Use a JPEG or PNG."; hint.classList.add("bad"); }
  });
  rm.addEventListener("click", () => { cover.blob = null; cover.auto = false; cover.show(null); hint.textContent = "The cover will be removed when you tap Save."; });
  root.addEventListener("input", (e) => { if ((e.target.id === "f-title" || e.target.id === "f-author") && !cover.hasImg) prev.innerHTML = coverHTML(getT(), null); });
}
async function saveCover(tid, cover) {
  if (cover.blob === undefined) return;
  if (cover.blob) await put("covers", tid, cover.blob); else await del("covers", tid);
}

function textSheet(id) {
  const t = id ? S.texts.get(id) : {};
  let parsed = null; const auto = {};
  const cover = { blob: undefined, auto: false, current: id ? coverURL(id) : null };
  openSheet(`<h2>${id ? "Edit text" : "Add a text"}</h2>
    ${id ? "" : fileField()}
    <div class="field"><label for="f-title">Title</label><input id="f-title" name="title" value="${esc(t.title)}" required></div>
    <div class="row2">
      <div class="field"><label for="f-author">Author</label><input id="f-author" name="author" value="${esc(t.author)}"></div>
      <div class="field"><label for="f-status">Status</label><select id="f-status" name="status">${Object.entries(STATUS).map(([k, v]) => `<option value="${k}" ${(t.status || "reading") === k ? "selected" : ""}>${v}</option>`).join("")}</select></div>
    </div>
    <div class="field"><label for="f-edition">Edition or translation</label><input id="f-edition" name="edition" value="${esc(t.edition)}"><span class="hint">Page numbers in your notes refer to this edition.</span></div>
    ${coverField(t, cover.current)}
    <div class="field"><label for="f-secs">Sections</label><textarea id="f-secs" name="sections" rows="5">${esc((t.sections || []).map((s) => s.label).join("\n"))}</textarea><span class="hint">One per line: chapters, essays, plateaus, lectures.</span></div>`,
  async (fd) => {
    const title = fd.get("title").trim(); if (!title) return "Give the text a title.";
    const old = (t.sections && t.sections.length) ? t.sections : parsed ? parsed.sections : [];
    const sections = fd.get("sections").split("\n").map((l) => l.trim()).filter(Boolean).map((label) => {
      const prev = old.find((s) => s.label === label); return prev ? { ...prev } : { id: gid(), label, done: false };
    });
    const tid = id || gid();
    const data = { ...(id ? t : { createdAt: Date.now() }), title, author: fd.get("author").trim(), edition: fd.get("edition").trim(), status: fd.get("status"), sections, updatedAt: Date.now() };
    if (parsed) {
      linkHeadings(parsed.blocks, parsed.sections, sections);
      const prog = $("#f-prog"); const say = (m) => { if (prog) prog.textContent = m; };
      await saveContent(tid, parsed.blocks, say);
      Object.assign(data, { hasContent: true, source: { name: parsed.name, kind: parsed.kind, pages: parsed.pages }, pos: 0, total: parsed.blocks.length });
    }
    await saveCover(tid, cover);
    await put("texts", tid, data);
    if (!S.texts.has(tid)) S.texts.set(tid, data);
    if (!id) return () => go({ screen: "text", textId: tid });
  },
  (root) => {
    const getT = () => ({ title: $("#f-title", root).value.trim() || "Untitled", author: $("#f-author", root).value.trim() });
    wireCover(root, cover, getT);
    if (id) return;
    wireFile(root, (r) => {
      parsed = r; if (!r) return;
      const fill = (sel, key, val) => { const el = $(sel, root); if (el && (!el.value.trim() || el.value === auto[key])) { el.value = val; auto[key] = val; } };
      fill("#f-title", "title", r.title);
      if (r.author) fill("#f-author", "author", r.author);
      fill("#f-secs", "secs", r.sections.map((s) => s.label).join("\n"));
      if (cover.blob === undefined || cover.auto) {
        if (r.cover) { cover.blob = r.cover; cover.auto = true; cover.show(r.cover); }
        else if (cover.auto) { cover.blob = undefined; cover.auto = false; cover.show(undefined); }
        else cover.show(undefined);
      }
    });
  });
}

function fileSheet(tid) {
  const t = S.texts.get(tid); let parsed = null;
  openSheet(`<h2>${t.hasContent ? "Replace the text" : "Load the text"}</h2><p class="sub">${esc(t.title)}</p>${fileField()}

  async () => {
    if (!parsed) return "Choose a file first.";

    await put("texts", tid, { ...cur, sections, hasContent: true, source: { name: parsed.name, kind: parsed.kind, pages: parsed.pages }, pos: 0, total: parsed.blocks.length, updatedAt: Date.now() });

function noteSheet(nid, preset) {
  const t = S.texts.get(S.textId);
  const n = nid ? S.notes.get(nid) : { kind: "passage", sectionId: S.sec !== "all" ? S.sec : "", ...(preset || {}) };
  if (!t || !n) return;
  openSheet(`<h2>${nid ? "Edit note" : preset ? "Save passage" : "Add a note"}</h2>
    <div class="row2">
      <div class="field"><label for="n-page">Page</label><input id="n-page" name="page" value="${esc(n.page)}" placeholder="e.g. 36 or xii"></div>
      <div class="field"><label for="n-kind">Kind</label><select id="n-kind" name="kind">${Object.entries(KINDS).map(([k, v]) => `<option value="${k}" ${n.kind === k ? "selected" : ""}>${v}</option>`).join("")}</select></div>
    </div>
    ${(t.sections || []).length ? `<div class="field"><label for="n-sec">Section</label><select id="n-sec" name="sectionId"><option value="">None</option>${t.sections.map((s) => `<option value="${esc(s.id)}" ${n.sectionId === s.id ? "selected" : ""}>${esc(s.label)}</option>`).join("")}</select></div>` : ""}
    <div class="field"><label for="n-passage">Passage, word for word</label><textarea id="n-passage" class="verbatim" name="passage">${esc(n.passage)}</textarea><span class="hint">${preset ? "Taken from the text. Fix any stray characters from the file." : "Copy exactly from the page. Keep your interpretation in the next box."}</span></div>

  async (fd) => {

    if (!passage && !gloss) return "Write a passage, a note, or both.";
    const data = { ...(nid ? n : { createdAt: Date.now() }), textId: S.textId, page: fd.get("page").trim(), kind: fd.get("kind"), sectionId: fd.get("sectionId") || "", passage, gloss, updatedAt: Date.now() };
    if (Number.isInteger(n.at)) data.at = n.at;
    delete data.example;
    await put("notes", nid || gid(), data);
    const cur = S.texts.get(S.textId);

/* ---------- reader ---------- */
let FS = 19; try { FS = Math.max(15, Math.min(26, +localStorage.getItem("mg-fs") || 19)); } catch {}
const applyFs = () => $("#book").style.setProperty("--fs", FS + "px");
const barH = () => $(".rbar")?.offsetHeight || 0;

function inlineHTML(x, marks) {
  if (!marks || !marks.length) return esc(x).replace(/\u0001/g, "<em>").replace(/\u0002/g, "</em>");
  let raw = x;
  if (marks && marks.length) {
    const map = []; let ps = "";
    for (let k = 0; k < raw.length; k++) { const c = raw[k]; if (c === I0 || c === I1) continue; map.push(k); ps += c; }
    const ins = [];
    for (const [id, p] of marks) {
      const want = p.replace(/\s+/g, " ").trim(); if (!want) continue;
      let s = ps.indexOf(want), len = want.length;
      for (const cut of [60, 30, 15]) {
        if (s >= 0 || cut >= want.length) continue;
        s = ps.indexOf(want.slice(0, cut));
        if (s >= 0) len = Math.min(want.length, ps.length - s);
      }
      if (s < 0 || !len) continue;
      ins.push([map[s], "\u0003" + id + "\u0005"], [map[s + len - 1] + 1, "\u0004"]);
    }
    ins.sort((a, b) => b[0] - a[0]);
    for (const [pos, str] of ins) raw = raw.slice(0, pos) + str + raw.slice(pos);
  }
  let out = "", depth = 0, mid = "";
  const open = () => `<mark data-note="${esc(mid)}">`;
  for (let k = 0; k < raw.length; k++) {
    const c = raw[k];
    if (c === "\u0003") { const e = raw.indexOf("\u0005", k); const id = raw.slice(k + 1, e); k = e; if (!depth) { mid = id; out += open(); } depth++; }
    else if (c === "\u0004") { depth = Math.max(0, depth - 1); if (!depth) out += "</mark>"; }
    else if (c === I0) out += depth ? `</mark><em>${open()}` : "<em>";
    else if (c === I1) out += depth ? `</mark></em>${open()}` : "</em>";
    else out += esc(c);
  }
  return out;
}
function blockHTML(b, i, marks) {
  if (b.k === "pg") return `<div class="bpg" data-i="${i}">${b.x ? `p. ${esc(b.x)}` : ""}</div>`;
  const x = inlineHTML(b.x || "", marks);
  if (b.k === "h") return `<h2 class="bh l${Math.min(b.l || 2, 4)}" data-i="${i}">${x}</h2>`;
  if (b.k === "q") return `<p class="bq" data-i="${i}">${x}</p>`;
  if (b.k === "fn") return `<p class="bfn" data-i="${i}">${x}</p>`;
  return `<p class="bp${b.k === "c" ? " cont" : ""}" data-i="${i}">${x}</p>`;
}
function marksByBlock(tid) {
  const m = new Map();
  for (const [id, n] of S.notes) if (n.textId === tid && Number.isInteger(n.at) && n.passage) { if (!m.has(n.at)) m.set(n.at, []); m.get(n.at).push([id, n.passage]); }
  return m;
}
const sigOf = (l) => (l ? l.map(([id, p]) => id + ":" + p).sort().join("|") : "");

function resetReader() { R.tid = null; R.blocks = null; R.els = []; R.tops = []; R.sig = new Map(); R.saved = -1; R.sel = null; $("#book").innerHTML = ""; $("#selbar").hidden = true; }

async function openReader(tid, at) {
  resetReader();
  S.screen = "reader"; S.textId = tid; render();
  window.scrollTo(0, 0);
  const t = S.texts.get(tid), book = $("#book");
  $("#rtitle").textContent = t?.title || ""; $("#rpg").textContent = "";
  applyFs();
  book.innerHTML = `<p class="rload">Loading the text…</p>`;
  let blocks;
  try { blocks = await loadContent(tid); }
  catch (e) { book.innerHTML = `<p class="rload">${esc(e instanceof UErr ? e.message : "Couldn't load this text. Check your connection and try again.")}</p>`; return; }
  if (S.screen !== "reader" || S.textId !== tid) return;
  if (!blocks) { book.innerHTML = `<p class="rload">This text isn't loaded yet. Go back and use Load file.</p>`; return; }
  R.tid = tid; R.blocks = blocks;
  let pg = "", sc = ""; R.pageAt = []; R.secAt = [];
  blocks.forEach((b, i) => { if (b.k === "pg") pg = b.x; if (b.k === "h" && b.s) sc = b.s; R.pageAt[i] = pg; R.secAt[i] = sc; });
  const marks = marksByBlock(tid);
  book.innerHTML = blocks.map((b, i) => blockHTML(b, i, marks.get(i))).join("");
  R.els = [...book.children];
  R.sig = new Map([...marks].map(([i, l]) => [i, sigOf(l)]));
  R.dirty = true;
  const target = Number.isInteger(at) ? at : Number.isInteger(t?.pos) ? t.pos : 0;
  R.saved = target;
  requestAnimationFrame(() => { goTo(target, Number.isInteger(at)); updatePg(); });
  const t0 = Date.now();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { R.dirty = true; if (R.tid === tid && Date.now() - t0 < 4000) goTo(target, Number.isInteger(at)); });
}

function measure() { R.tops = R.els.map((e) => e.getBoundingClientRect().top + window.scrollY); R.dirty = false; }
function currentBlock() {
  if (!R.els.length) return 0;
  if (R.dirty) measure();
  const y = window.scrollY + barH() + 12;
  let lo = 0, hi = R.tops.length - 1, ans = 0;
  while (lo <= hi) { const mid = (lo + hi) >> 1; if (R.tops[mid] <= y) { ans = mid; lo = mid + 1; } else hi = mid - 1; }
  return ans;
}
function goTo(i, centre) {
  const el = R.els[Math.max(0, Math.min(i, R.els.length - 1))]; if (!el) return;
  const top = el.getBoundingClientRect().top + window.scrollY;
  const off = centre ? Math.max(barH() + 8, window.innerHeight * 0.3) : barH() + 8;
  window.scrollTo(0, Math.max(0, top - off));
}
function updatePg() { const i = currentBlock(); const p = R.pageAt[i]; $("#rpg").textContent = p ? `p. ${p}` : ""; }
function savePos() {
  if (!R.blocks || !R.tid) return;
  const atEnd = window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 60;
  const i = atEnd ? R.blocks.length - 1 : currentBlock(); if (i === R.saved) return; R.saved = i;
  const t = S.texts.get(R.tid);
  if (t) put("texts", R.tid, { ...t, pos: i, total: R.blocks.length, updatedAt: Date.now() }).catch(() => {});
}
function setFs(d) { const i = currentBlock(); FS = Math.max(15, Math.min(26, FS + d)); applyFs(); try { localStorage.setItem("mg-fs", String(FS)); } catch {} R.dirty = true; goTo(i); }

function refreshMarks() {
  if (!R.blocks || R.tid !== S.textId) return;
  const marks = marksByBlock(R.tid);
  const keys = new Set([...marks.keys(), ...R.sig.keys()]);
  for (const i of keys) {
    const s = sigOf(marks.get(i));
    if (s === (R.sig.get(i) || "") || !R.blocks[i] || !R.els[i]) continue;
    const tmp = document.createElement("div"); tmp.innerHTML = blockHTML(R.blocks[i], i, marks.get(i));
    const el = tmp.firstElementChild; R.els[i].replaceWith(el); R.els[i] = el;
    if (s) R.sig.set(i, s); else R.sig.delete(i);
  }
}

function tocPanel() {
  if (!R.blocks) return;
  const items = R.blocks.map((b, i) => (b.k === "h" ? `<button class="tocitem l${Math.min(b.l || 2, 4)}" data-goto="${i}"><span>${esc(plain(b.x))}</span><span class="tp">${R.pageAt[i] ? esc(R.pageAt[i]) : ""}</span></button>` : "")).join("");
  openPanel(`<h2>Contents</h2><div class="toc">${items || `<p class="empty">No headings were found in this text.</p>`}</div>`, (b) => { if (b.dataset.goto) goTo(+b.dataset.goto); });
}

let selT;
document.addEventListener("selectionchange", () => { clearTimeout(selT); selT = setTimeout(checkSel, 140); });
function checkSel() {
  const bar = $("#selbar");
  if (S.screen !== "reader" || !R.blocks) { bar.hidden = true; return; }
  const sel = window.getSelection();
  if (!sel || sel.isCollapsed || !sel.rangeCount) { bar.hidden = true; return; }
  const r = sel.getRangeAt(0), book = $("#book");
  if (!book.contains(r.commonAncestorContainer)) { bar.hidden = true; return; }
  const text = sel.toString().replace(/\s+/g, " ").trim();
  if (text.length < 2) { bar.hidden = true; return; }
  const idxOf = (node) => { const el = (node.nodeType === 1 ? node : node.parentElement)?.closest("[data-i]"); return el ? +el.dataset.i : null; };
  const i = idxOf(r.startContainer) ?? currentBlock(), j = idxOf(r.endContainer) ?? i;
  const a = R.pageAt[i] || "", b = R.pageAt[j] || "";
  const page = a && b && a !== b ? `${a}–${b}` : a;
  R.sel = { text, i, page, sec: R.secAt[i] || "" };
  $("#selsave").textContent = page ? `Save passage · p. ${page}` : "Save passage";
  bar.hidden = false;
}
function saveSel() {
  const s = R.sel; if (!s) return;
  $("#selbar").hidden = true;
  try { window.getSelection().removeAllRanges(); } catch {}
  noteSheet(null, { passage: s.text, page: s.page, sectionId: s.sec, at: s.i, kind: "passage" });
}
["mousedown", "pointerdown"].forEach((ev) => $("#selsave").addEventListener(ev, (e) => e.preventDefault()));

let rafP = 0, posT = 0;
window.addEventListener("scroll", () => {
  if (S.screen !== "reader" || !R.blocks) return;
  if (!rafP) rafP = requestAnimationFrame(() => { rafP = 0; updatePg(); });
  clearTimeout(posT); posT = setTimeout(savePos, 1500);
}, { passive: true });
window.addEventListener("resize", () => { R.dirty = true; });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden" && S.screen === "reader") savePos(); });

/* ---------- events ---------- */
function arm(btn, run) {
  if (btn.classList.contains("armed")) { run(); return; }
  btn.classList.add("armed"); const old = btn.textContent; btn.textContent = "Tap again to delete";
  setTimeout(() => { if (btn.isConnected) { btn.classList.remove("armed"); btn.textContent = old; } }, 3000);
}
document.addEventListener("click", (e) => {
  const mk = e.target.closest && e.target.closest("mark[data-note]");
  if (mk && S.screen === "reader") { const s = window.getSelection(); if (!s || s.isCollapsed) { noteSheet(mk.dataset.note); return; } }
  const b = e.target.closest && e.target.closest("button"); if (!b || b.closest("#sheetroot")) return;
  if (b.id === "addtext") return textSheet(null);
  if (b.id === "back") return back();
  if (b.dataset.open) return go({ screen: "text", textId: b.dataset.open });
  if (b.id === "read") return go({ screen: "reader", textId: S.textId });
  if (b.id === "loadfile") return fileSheet(S.textId);
  if (b.dataset.gotoNote) return go({ screen: "reader", textId: b.dataset.tid, at: +b.dataset.gotoNote });
  if (b.id === "rback") return back();
  if (b.id === "rsmall") return setFs(-1);
  if (b.id === "rbig") return setFs(1);
  if (b.id === "rtoc") return tocPanel();
  if (b.id === "selsave") return saveSel();
  if (b.id === "edittext") return textSheet(S.textId);
  if (b.id === "deltext") return arm(b, async () => {
    const id = S.textId;
    await back();
    try {
      for (const [nid] of notesFor(id)) await del("notes", nid);
      await del("content", id);
      await del("covers", id);
      await del("texts", id);
    } catch (err) { toast(failMsg(err)); }
    render();
  });
  if (b.id === "backup") return exportBackup().catch((e) => toast(failMsg(e)));
  if (b.id === "exportnotes") {
    const t = S.texts.get(S.textId);
    if (!notesFor(S.textId).length) return toast("This text has no notes to export yet.");
    return saveFile(`${slug(t && t.title)}-notes.md`, notesMarkdown(S.textId), "text/markdown").catch(() => toast("Couldn't export the notes."));
  }
  if (b.id === "addnote") return noteSheet(null);
  if (b.dataset.editnote) return noteSheet(b.dataset.editnote);
  if (b.dataset.delnote) return arm(b, () => del("notes", b.dataset.delnote).catch(() => {}));
  if (b.dataset.sec) { S.sec = S.sec === b.dataset.sec ? "all" : b.dataset.sec; return render(); }
  if (b.dataset.kind) { S.kind = b.dataset.kind; return render(); }
});
document.addEventListener("change", (e) => {
  if (e.target.id === "restore") { const f = e.target.files && e.target.files[0]; e.target.value = ""; if (f) importBackup(f); return; }
  if (S.screen !== "text") return;
  const t = S.texts.get(S.textId);
  if (e.target.id === "status" && t) put("texts", S.textId, { ...t, status: e.target.value, updatedAt: Date.now() }).catch(() => {});
  if (e.target.dataset && e.target.dataset.tick && t) {
    const sections = t.sections.map((s) => (s.id === e.target.dataset.tick ? { ...s, done: e.target.checked } : s));
    put("texts", S.textId, { ...t, sections, updatedAt: Date.now() }).catch(() => {});
  }
});
let qTimer;
document.addEventListener("input", (e) => {
  if (e.target.id !== "q" && e.target.id !== "tq") return;
  const key = e.target.id; S[key] = e.target.value;
  clearTimeout(qTimer); qTimer = setTimeout(() => { render(); const el = $("#" + key); if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); } }, 180);
});

/* ---------- boot ---------- */
render();
(async () => {
  try {
    idb = await idbOpen();
    S.texts = await idbAll("texts");
    S.notes = await idbAll("notes");
    S.covers = await idbAll("covers");
    S.mode = "ready";
  } catch { idb = null; S.mode = "local"; }
  render();
  try { if (navigator.storage && navigator.storage.persist) S.persisted = await navigator.storage.persist(); } catch {}
})();
if ("serviceWorker" in navigator && location.protocol === "https:") {
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}
</script>
</body>
</html>
