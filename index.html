    x: "Aristotle had distinguished using a shoe from exchanging it, and Marx cites him. Capital begins with this twofold character of the commodity and traces it to the twofold character of labor: concrete labor produces use values, abstract labor produces value. Money is the commodity in which exchange value becomes independent, and the tension between use and exchange runs through later critiques of commodification.",
    s: "Marx, Capital, vol. 1 (1867), ch. 1; Aristotle, Politics I.9",
    p: ["aristotle", "marx"], r: ["commodity-fetishism", "surplus-value"], br: ["marxism"], k: ["use value", "use-value", "exchange value", "exchange-value", "abstract labor", "abstract labour"] },
  { id: "surplus-value", t: "Surplus value", a: "crit",
    d: "Marx: the difference between the value that labor-power creates in production and the value of labor-power itself, paid as wages. The capitalist appropriates it, and it is the source of profit.",
    x: "Workers sell their capacity to work for a day, and in that day they produce more value than their wages. Capital raises surplus value absolutely, by lengthening the working day, and relatively, by raising productivity. Marx calls the ratio of surplus value to wages the rate of exploitation.",
    s: "Marx, Capital, vol. 1 (1867), parts 3–5",
    p: ["marx"], r: ["use-exchange-value", "primitive-accumulation", "alienation", "social-reproduction"], br: ["marxism"], k: ["surplus value", "surplus-value", "labor-power", "labour-power"] },
  { id: "primitive-accumulation", t: "Primitive accumulation", a: "crit",
    d: "Marx: the historical process, through enclosure, expropriation and colonial plunder, that separated producers from their means of production and made capitalist relations possible.",
    x: "Marx mocked the political economists' story of a thrifty elite and an idle majority, and documented how the English peasantry was driven off the land by enclosure and bloody legislation. Federici argues that the witch hunts and the disciplining of women's bodies belong to the same process, and David Harvey's “accumulation by dispossession” holds that such processes continue today through privatization and debt.",
    s: "Marx, Capital, vol. 1 (1867), part 8; Federici, Caliban and the Witch (2004)",
    p: ["marx", "federici"], r: ["racial-capitalism", "social-reproduction", "surplus-value", "historical-materialism"], br: ["marxism", "history"], k: ["primitive accumulation", "original accumulation", "accumulation by dispossession"] },
  { id: "ideology", t: "Ideology", a: "crit",
    d: "Ideas and representations that express and legitimate existing social relations. For Marx and Engels, the ruling ideas of each epoch are the ideas of its ruling class.",
    x: "Destutt de Tracy coined the word in the 1790s for a science of ideas. Marx and Engels used it for distorted consciousness that hides social contradictions. Later Marxists broadened it: Gramsci tied it to hegemony, Althusser to the practices and apparatuses that make individuals into subjects. Outside Marxism, “ideology” can mean any comprehensive political worldview.",
    s: "Marx and Engels, The German Ideology (1845–46); Althusser, “Ideology and Ideological State Apparatuses” (1970)",
    p: ["marx", "engels", "gramsci", "althusser"], r: ["hegemony", "interpellation", "naturalization", "base-superstructure"], br: ["marxism", "political"], k: ["ideology", "ideological"] },
  { id: "hegemony", t: "Hegemony", a: "crit",
    d: "Gramsci: a class rules through consent as well as coercion, by making its view of the world into society's common sense.",
    x: "Gramsci developed the concept in prison to explain why revolution had succeeded in Russia and failed in western Europe, where power rests on consent organized in civil society, through schools, churches, the press and intellectuals, as well as on the state's coercion. Countering it requires a long “war of position”. Stuart Hall used hegemony to analyze Thatcherism, and Laclau and Mouffe recast it as the articulation of political identities in discourse.",
    s: "Gramsci, Prison Notebooks (1929–35); Laclau and Mouffe, Hegemony and Socialist Strategy (1985)",
    p: ["gramsci", "hall"], r: ["ideology", "subaltern", "interpellation", "base-superstructure"], br: ["marxism", "political"], k: ["hegemony", "hegemonic", "war of position"] },
  { id: "interpellation", t: "Interpellation", a: "crit",
    d: "Althusser: ideology “hails” individuals and in doing so constitutes them as subjects.",
    x: "Althusser's example is a police officer calling “Hey, you there!”: the person who turns around recognizes themselves as the one addressed and so becomes a subject. Ideology, he argues, exists in material practices and in Ideological State Apparatuses such as school, family, church and media. Butler revisits the scene in her account of subjection and performativity.",
    s: "Althusser, “Ideology and Ideological State Apparatuses” (1970); Butler, The Psychic Life of Power (1997)",
    p: ["althusser", "butler"], r: ["subjectivation", "ideology", "performativity", "hegemony"], br: ["marxism", "poststructuralism"], k: ["interpellation", "interpellate", "interpellated", "interpellates", "ideological state apparatus"] },
  { id: "critical-theory", t: "Critical theory", a: "crit",
    d: "In the narrow sense, the Frankfurt School's program of social theory aimed at emancipation. In a broader sense, a family of critical approaches that includes critical race theory and feminist theory.",
    x: "Horkheimer set traditional theory, which takes the existing order as given, against critical theory, which aims at a rational society free of domination. The first generation (Horkheimer, Adorno, Marcuse) joined Marx with Freud and Weber; Habermas reoriented the program toward communication and democracy, Honneth toward recognition. Critical race theory began in American legal scholarship in the 1970s and 1980s with Derrick Bell, Kimberlé Crenshaw and others.",
    s: "Horkheimer, “Traditional and Critical Theory” (1937)",
    p: ["horkheimer", "adorno", "marcuse", "habermas", "honneth", "bell"], r: ["immanent-critique", "culture-industry", "instrumental-reason", "communicative-action", "intersectionality"], br: ["critical-theory"], k: ["critical theory", "frankfurt school", "critical race theory"] },
  { id: "culture-industry", t: "Culture industry", a: "crit",
    d: "Horkheimer and Adorno's term for the mass production of culture (film, radio, magazines, popular music) as standardized commodities that train their audiences in conformity.",
    x: "In Dialectic of Enlightenment they argue that the culture industry offers pseudo-individuality: products differ in detail and follow the same formulas, and leisure becomes an extension of work. Amusement promises escape and delivers adaptation. Critics charge the analysis with elitism; cultural studies, from Stuart Hall and the Birmingham school onward, stressed how audiences actively decode what they consume.",
    s: "Horkheimer and Adorno, Dialectic of Enlightenment (1944/1947), “The Culture Industry: Enlightenment as Mass Deception”",
    p: ["horkheimer", "adorno", "hall"], r: ["aura", "commodity-fetishism", "instrumental-reason", "reification", "hegemony"], br: ["critical-theory", "aesthetics"], k: ["culture industry", "mass culture"] },
  { id: "instrumental-reason", t: "Instrumental reason", a: "crit",
    d: "Reason reduced to calculating the most efficient means to given ends, with the ends themselves left outside rational discussion.",
    x: "Horkheimer's Eclipse of Reason sets this subjective reason against an older objective reason, which asked what ends are worth pursuing. With Adorno he argued that enlightenment's drive to master nature turns into the domination of human beings. The theme draws on Weber's account of rationalization and the “iron cage”, and Habermas answered it with a theory of communicative reason.",
    s: "Horkheimer, Eclipse of Reason (1947); Horkheimer and Adorno, Dialectic of Enlightenment (1944/1947); Weber, The Protestant Ethic and the Spirit of Capitalism (1905)",
    p: ["weber", "horkheimer", "adorno", "marcuse"], r: ["reification", "culture-industry", "communicative-action", "critical-theory"], br: ["critical-theory"], k: ["instrumental reason", "instrumental rationality", "rationalization", "iron cage"] },
  { id: "communicative-action", t: "Communicative action", a: "crit",
    d: "Habermas: action oriented to reaching understanding, in which speakers coordinate by raising validity claims (to truth, rightness and sincerity) that others can accept or contest with reasons.",
    x: "Habermas sets it against strategic action, which aims at success by influencing others. In discourse, participants test contested claims under conditions approaching an “ideal speech situation”, where only the force of the better argument counts. This grounds his discourse ethics, his theory of deliberative democracy, and his worry that markets and bureaucracies colonize the lifeworld.",
    s: "Habermas, The Theory of Communicative Action (1981); Between Facts and Norms (1992)",
    p: ["habermas"], r: ["lifeworld", "instrumental-reason", "critical-theory", "discourse"], br: ["critical-theory", "political"], k: ["communicative action", "communicative rationality", "ideal speech situation", "public sphere"] },
  // Critical theory: structuralism, post-structuralism and Foucault
  { id: "structuralism", t: "Structuralism", a: "crit",
    d: "The view that meaning and identity arise from differential relations within a system. Elements mean nothing in isolation; they mean by their differences from other elements.",
    x: "Saussure's linguistics was the model. Lévi-Strauss analyzed kinship and myth as systems of oppositions, Lacan reread Freud through linguistics, Barthes analyzed fashion, myth and narrative, and Althusser read Marx structurally. Critics charged that structuralism had no account of history or agency, and post-structuralism grew from within it.",
    s: "Saussure, Course in General Linguistics (1916); Lévi-Strauss, Structural Anthropology (1958)",
    p: ["saussure", "levistrauss", "lacan", "barthes", "althusser"], r: ["signifier", "post-structuralism", "differance"], br: ["poststructuralism"], k: ["structuralism", "structuralist"] },
  { id: "signifier", t: "Signifier and signified", a: "crit",
    d: "Saussure: a sign unites a sound-image, the signifier, with a concept, the signified. The bond between them is arbitrary.",
    x: "Arbitrary here means unmotivated: nothing in the sound “tree” resembles a tree. In language, Saussure says, there are only differences without positive terms. Lacan gave the signifier priority over the signified, and Derrida argued that the signified is never present outside the play of signifiers.",
    s: "Saussure, Course in General Linguistics (1916)",
    p: ["saussure", "barthes", "lacan", "derrida"], r: ["structuralism", "differance", "deconstruction"], br: ["poststructuralism", "language"], k: ["signifier", "signified", "semiotics", "semiology"] },
  { id: "differance", t: "Différance", a: "crit",
    d: "Derrida's coinage from the French différer, which means both “to differ” and “to defer”: a sign means by its differences from other signs, and its meaning is always deferred along a chain of further signs, never fully present.",
    x: "The silent “a” can be seen in writing and cannot be heard in speech, which suits Derrida's argument against the priority of speech over writing. He first used the word in a 1963 paper and set it out in the 1968 lecture “Différance”. Derrida insisted that it is neither a word nor a concept in the ordinary sense, since it names the condition of any concept's identity.",
    s: "Derrida, “Différance” (1968), in Margins of Philosophy (1972)",
    p: ["saussure", "derrida"], r: ["deconstruction", "signifier", "structuralism", "post-structuralism"], br: ["poststructuralism", "language"], k: ["différance", "differance"] },
  { id: "post-structuralism", t: "Post-structuralism", a: "crit",
    d: "A label, mostly from the English-speaking reception, for thinkers who questioned the stability of structures, origins and the unified subject.",
    x: "Few of those it names used the label. They share a suspicion of fixed structures and origins, attention to how meaning slips and how power operates through discourse, and a critique of the self-transparent subject. Major works appeared from the late 1960s, including Derrida's Of Grammatology (1967), Kristeva's Revolution in Poetic Language (1974), Foucault's Discipline and Punish (1975) and Lyotard's The Postmodern Condition (1979).",
    p: ["barthes", "derrida", "foucault", "kristeva", "lyotard"], r: ["structuralism", "deconstruction", "discourse", "differance", "genealogy"], br: ["poststructuralism"], k: ["post-structuralism", "poststructuralism", "post-structuralist", "postmodernism"] },
  { id: "deconstruction", t: "Deconstruction", a: "crit",
    d: "Derrida's practice of reading, which shows how a text's hierarchical oppositions (speech and writing, presence and absence) depend on the term they subordinate.",
    x: "Derrida criticized the “metaphysics of presence”, the privileging of speech, consciousness and origin as immediately present. Deconstruction first reverses a hierarchy and then displaces it, showing the subordinated term at work inside the dominant one. It spread to literary studies through Paul de Man and the Yale critics and to law, architecture and political theory; Derrida insisted it is neither a method nor a purely negative critique.",
    s: "Derrida, Of Grammatology (1967); “Différance” (1968)",
    p: ["derrida"], r: ["differance", "signifier", "post-structuralism", "hermeneutics"], br: ["poststructuralism"], k: ["deconstruction", "deconstruct", "deconstructive", "metaphysics of presence"] },
  { id: "discourse", t: "Discourse", a: "crit",
    d: "In Foucault, a regulated system of statements and practices that forms the objects it speaks about and decides who may speak about them with authority.",
    x: "Foucault's archaeology studies discursive formations: the rules that govern which statements can be made, by whom, about which objects. In his later work discourse is bound up with power, as in the medical, psychiatric and penal knowledges that classify people. Others use the word differently: for Habermas, discourse is argumentation aimed at justified agreement, and in linguistics it simply means language above the level of the sentence.",
    s: "Foucault, The Archaeology of Knowledge (1969); “The Order of Discourse” (1970)",
    p: ["foucault", "habermas"], r: ["power-knowledge", "episteme", "genealogy", "naturalization", "orientalism"], br: ["poststructuralism"], k: ["discourse", "discursive"] },
  { id: "power-knowledge", t: "Power/knowledge", a: "crit",
    d: "Foucault: power and knowledge directly imply one another. Power relations constitute fields of knowledge, and knowledge in turn sustains relations of power.",
    x: "Foucault rejects the picture of knowledge as neutral and of power as purely repressive: “power produces; it produces reality; it produces domains of objects and rituals of truth”. The human sciences arise together with disciplinary institutions, such as prisons, clinics and schools, that observe, examine and normalize individuals.",
    s: "Foucault, Discipline and Punish (1975), Part 3; Power/Knowledge (interviews, 1980)",
    p: ["foucault"], r: ["discourse", "panopticism", "biopower", "episteme", "orientalism"], br: ["poststructuralism"], k: ["power/knowledge", "power-knowledge"] },
  { id: "episteme", t: "Episteme", a: "crit",
    d: "Foucault: the underlying order that, in a given period, determines what can count as knowledge and how things can be known. He also calls it a “historical a priori”.",
    x: "The Order of Things describes three epistemes: the Renaissance, organized by resemblance; the Classical age, by representation and ordered tables; and the modern, in which “man” appears as both object and subject of knowledge. The book ends by wagering that man may be erased “like a face drawn in sand at the edge of the sea”. Foucault later moved from archaeology to genealogy and the study of power.",
    s: "Foucault, The Order of Things (1966)",
    p: ["foucault"], r: ["discourse", "paradigm", "power-knowledge", "a-priori"], br: ["poststructuralism", "epistemology"], k: ["episteme", "epistemes", "historical a priori"] },
  { id: "genealogy", t: "Genealogy", a: "crit",
    d: "A historical method that traces how values, concepts or institutions came to be, exposing their contingent and often conflictual origins.",
    x: "Nietzsche's Genealogy traces good and evil, guilt and the ascetic ideal to struggles between forces, and asks what value our values have. Foucault took up the method to show how practices of punishment, sexuality and madness came to seem natural, attending to descent (Herkunft) and emergence (Entstehung) and treating the search for a pure origin with suspicion. Exposing a belief's history can weaken its claim to be natural or necessary, which makes genealogy a tool of critique.",
    s: "Nietzsche, On the Genealogy of Morality (1887), Preface §6; Foucault, “Nietzsche, Genealogy, History” (1971)",
    p: ["nietzsche", "foucault"], r: ["naturalization", "discourse", "power-knowledge", "ressentiment", "will-to-power"], br: ["poststructuralism", "history"], k: ["genealogy", "genealogical"] },
  { id: "biopower", t: "Biopower", a: "crit",
    d: "Foucault: power that takes life itself as its object, both by disciplining individual bodies and by regulating whole populations.",
    x: "Foucault describes a shift from the sovereign's ancient right “to take life or let live” to a power “to foster life or disallow it to the point of death”. Biopower has two poles: an anatomo-politics of the body (discipline) and a biopolitics of the population (birth rates, health, longevity). In the 1976 lectures he argues that racism lets biopower divide the population and justify killing. Agamben and Mbembe develop the concept toward bare life and necropolitics.",
    s: "Foucault, The History of Sexuality, vol. 1 (1976), Part 5; “Society Must Be Defended” (lectures 1975–76)",
    p: ["foucault", "agamben", "mbembe"], r: ["governmentality", "necropolitics", "sovereignty", "panopticism", "state-of-exception"], br: ["poststructuralism", "political"], k: ["biopower", "biopolitics", "biopolitical"] },
  { id: "governmentality", t: "Governmentality", a: "crit",
    d: "Foucault: the art of governing understood as the “conduct of conduct”, the ways institutions, experts and individuals themselves shape how people behave.",
    x: "Foucault traces the arts of government from Christian pastoral power through reason of state and police to liberalism, which governs through the freedom of individuals and markets. His lectures The Birth of Biopolitics analyze neoliberalism as the extension of market rationality to every area of life. Governmentality studies apply the concept to welfare, risk, health and the self-management of individuals.",
    s: "Foucault, Security, Territory, Population (lectures 1977–78); The Birth of Biopolitics (lectures 1978–79)",
    p: ["foucault"], r: ["biopower", "power-knowledge", "panopticism", "subjectivation"], br: ["poststructuralism", "political"], k: ["governmentality", "conduct of conduct", "neoliberalism"] },
  { id: "panopticism", t: "Panopticism", a: "crit",
    d: "Foucault's name for disciplinary power modeled on Bentham's Panopticon, a prison in which inmates can always be seen and never know when they are watched, so that they come to watch themselves.",

  { id: "performativity", t: "Performativity", a: "crit",
    d: "Austin: some utterances perform the act they name (“I promise”). Butler: gender is constituted through the repetition of performative acts.",

  { id: "social-reproduction", t: "Social reproduction", a: "crit",

  { id: "necropolitics", t: "Necropolitics", a: "crit",

  { id: "negritude", t: "Négritude", a: "crit",

  { id: "expenditure", t: "Expenditure (dépense)", a: "crit",

  { id: "accelerationism", t: "Accelerationism", a: "crit",

function allTerms() {
  const out = new Map(GLOSSARY.map((g) => [g.id, { ...g, builtIn: true }]));
  for (const [id, u] of S.terms) {
    if (id.startsWith("~")) continue; // settings kept with the glossary, such as your look-up aliases
    const base = out.get(id);
    out.set(id, { ...(base || {}), ...u, id, builtIn: !!base, edited: !!base });
  }
  return [...out.values()].sort((x, y) => x.t.localeCompare(y.t, undefined, { sensitivity: "base" }));
}
const reEsc = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
function termKeys(g) {
  const keys = g.edited || !g.builtIn ? [g.t.replace(/\s*\(.*?\)\s*/g, " ").trim()] : g.k || [g.t.replace(/\s*\(.*?\)\s*/g, " ").trim()];
  return keys.filter((k) => k.length > 2);
}
function termNotes(g) {
  const keys = termKeys(g); if (!keys.length) return [];
  const re = new RegExp(`(^|[^\\p{L}])(${keys.map(reEsc).join("|")})(s|es)?(?![\\p{L}])`, "iu");
  return [...S.notes.entries()].filter(([, n]) => re.test(n.passage || "") || re.test(n.gloss || "")).sort(([, a], [, b]) => (b.createdAt || 0) - (a.createdAt || 0));
}
// Links between terms run both ways: if A lists B, B shows A too. A contrast is listed once, under "Contrast with".
const LINKS = (() => {
  const see = new Map(), vs = new Map();
  const add = (m, a, b) => { if (!m.has(a)) m.set(a, new Set()); m.get(a).add(b); };
  for (const g of GLOSSARY) {
    for (const r of g.r || []) { add(see, g.id, r); add(see, r, g.id); }
    for (const r of g.vs || []) { add(vs, g.id, r); add(vs, r, g.id); }
  }
  for (const [a, set] of vs) for (const b of set) if (see.has(a)) see.get(a).delete(b);
  return { see, vs };
})();

const branchChips = (ids) => ids.map((id) => BRANCH.get(id)).filter(Boolean).map((b) => `<button class="chip bchip2" data-branch="${esc(b.id)}">${esc(b.n)}</button>`).join("");

const termMap = () => new Map(allTerms().map((g) => [g.id, g]));
function termHTML(g, tmap) {

      : `<p class="hint">Wiktionary has no entry for “${esc(word)}”.</p>`;
  };
  const cached = dictCache()[word];
  if (cached) { draw(cached); return; }
  if (navigator.onLine === false) { el.innerHTML = `<p class="hint">You're offline. Words you've looked up before are kept here.</p>`; return; }
  try { const e = await dictFetch(word); dictSave(word, e); draw(e); }
  catch { if (el.isConnected) el.innerHTML = `<p class="hint">Couldn't reach Wiktionary just now.</p>`; }
}

const THINKERS = [
  ["parmenides", "Parmenides", "", "early 5th c. BCE", "Eleatic philosopher who argued that being is one, whole and unchanging.", ["On Nature (fragments)"], []],
  ["socrates", "Socrates", "", "c. 470–399 BCE", "Athenian philosopher whose questioning of virtue, knowledge and the examined life profoundly shaped later philosophy.", ["Plato, Apology", "Plato, Euthyphro"], [], { x: "Socrates lived in Athens and left no writings. Accounts of his conversations survive chiefly through Plato and Xenophon, while Aristophanes portrayed him in comedy. These sources differ in purpose and presentation, making the reconstruction of his own philosophical views a longstanding scholarly problem. Plato’s Apology depicts his trial in 399 BCE on charges of impiety and corrupting the young; Socrates was condemned to death.\n\nIn Plato’s early dialogues, Socrates asks his interlocutors to explain such qualities as courage, piety and virtue, then tests their answers through further questions. The conversations frequently end in aporia, an acknowledged difficulty or unresolved question. His insistence on examining one’s beliefs and conduct helped establish philosophical inquiry as an activity of ethical self-scrutiny. Readers should distinguish the historical Socrates from the literary character who appears in Plato’s dialogues.", src: "https://plato.stanford.edu/entries/socrates/", srcName: "Stanford Encyclopedia of Philosophy" }],
  ["plato", "Plato", "", "c. 428–348 BCE", "Student of Socrates and founder of the Academy; theory of Forms.", ["Republic", "Symposium", "Phaedo", "Theaetetus"], ["socrates", "parmenides"], { x:  "Almost everything Plato wrote is a dialogue, and Socrates leads the conversation in nearly all of them (the Laws is the exception). Through them run his best-known doctrines: eternal, unchanging Forms, and a soul distinct from the body. Scholars often sort the dialogues into early “Socratic” works, a middle group centred on the Forms (Phaedo, Republic) and late works (Timaeus, Laws), though the grouping is disputed.", src:  "https://plato.stanford.edu/entries/plato/", srcName:  "Stanford Encyclopedia of Philosophy" }],
  ["aristotle", "Aristotle", "", "384–322 BCE", "Student of Plato and founder of the Lyceum; first systematic logic, ethics and biology.", ["Metaphysics", "Physics", "Nicomachean Ethics", "Politics"], ["plato"], { x:  "Aristotle studied at Plato’s Academy for about twenty years, tutored the young Alexander in Macedon, and in 335 BCE founded his own school, the Lyceum, whose members were called Peripatetics. About thirty-one of his works survive, covering logic, metaphysics, ethics, politics, rhetoric and biology; most read like lecture notes and drafts. His writings shaped philosophy from late antiquity through the Renaissance.", src:  "https://plato.stanford.edu/entries/aristotle/", srcName:  "Stanford Encyclopedia of Philosophy" }],
  ["pyrrho", "Pyrrho of Elis", "Pyrrho", "c. 360–270 BCE", "Greek philosopher associated with the beginnings of the skeptical tradition named Pyrrhonism.", [], [], { x: "Pyrrho of Elis wrote no surviving works. Much of the evidence for his outlook comes through his follower Timon, whose writings survive in fragments and later reports. An especially important testimony, preserved by Eusebius from Aristocles, describes Pyrrho’s concern with how things are by nature, how people should respond to them and what follows from that response. The transmission of this evidence makes the precise interpretation of his position disputed.\n\nThe reports associate Pyrrho with freedom from disturbance, or ataraxia, and with an attitude of restraint toward claims about how things really are. Later Pyrrhonists developed systematic practices of opposing arguments and suspending judgment; their doctrines cannot simply be read back into Pyrrho’s own life. His importance lies both in the example of philosophical equanimity attributed to him and in the skeptical tradition that subsequently took his name.", src: "https://plato.stanford.edu/entries/pyrrho/", srcName: "Stanford Encyclopedia of Philosophy" }],
  ["epicurus", "Epicurus", "", "341–270 BCE", "Founder of the Garden, whose philosophy connects atomistic physics with pleasure, friendship and freedom from fear.", ["Letter to Menoeceus", "Principal Doctrines"], [], { x: "Epicurus founded a philosophical community known as the Garden in Athens. His system joined an atomistic account of nature to an ethics centered on pleasure and the avoidance of suffering. He held that the soul is bodily and dissolves at death, and he used this account to challenge fear of punishment after death. His surviving letters and collections of maxims offer a condensed introduction to a much larger body of writings that has mostly been lost.\n\nIn the Letter to Menoeceus, Epicurus distinguishes natural and necessary desires from desires that generate avoidable anxiety. He identifies freedom from bodily pain (aponia) and mental disturbance (ataraxia) as central to a pleasant life. Prudence, friendship and a modest way of living have important places in his ethics. His understanding of pleasure is therefore closely tied to assessing desires, limiting fear and cultivating stable conditions for living well.", src: "https://plato.stanford.edu/entries/epicurus/", srcName: "Stanford Encyclopedia of Philosophy" }],
  ["lucretius", "Lucretius", "", "c. 99–55 BCE", "Roman poet who set out Epicurean atomism in verse.", ["On the Nature of Things"], ["epicurus"]],

  ["sextus", "Sextus Empiricus", "Sextus", "2nd–3rd c. CE", "Physician and Pyrrhonist whose writings preserve ancient skepticism.", ["Outlines of Pyrrhonism", "Against the Mathematicians"], ["pyrrho"]],
  ["augustine", "Augustine of Hippo", "Augustine", "354–430", "North African bishop who joined Christian theology with Platonism.", ["Confessions (c. 400)", "The City of God (413–426)"], ["plato"]],
  ["confucius", "Confucius (Kongzi)", "Confucius", "trad. 551–479 BCE", "Teacher whose sayings on ritual, humaneness and government founded the Confucian tradition.", ["Analects (compiled by his followers)"], [], { x:  "Confucius held office in the state of Lu before turning to teaching; tradition credits him with seventy-seven direct disciples. His sayings survive in the Analects, a twenty-chapter collection said to have been compiled by his followers. Its central ideals are ren (humaneness), yi (righteousness), li (ritual propriety), zhi (wisdom) and xin (trustworthiness), embodied by the junzi, the exemplary person.", src:  "https://plato.stanford.edu/entries/confucius/", srcName:  "Stanford Encyclopedia of Philosophy" }],
  ["laozi", "Laozi", "", "trad. 6th c. BCE", "Legendary author of the Daodejing, the founding text of Daoism.", ["Daodejing"], [], { x:  "Whether Laozi existed is disputed; some scholars treat him as entirely legendary. The Daodejing, the “five-thousand-character” classic in 81 short chapters, is probably an anthology that settled into a stable form by the mid-third century BCE. Its key ideas are dao (the way), de (virtue or power), ziran (naturalness) and wuwei (non-action); it has drawn hundreds of commentaries and is a founding scripture of religious Daoism.", src:  "https://plato.stanford.edu/entries/laozi/", srcName:  "Stanford Encyclopedia of Philosophy" }],

  ["kant", "Immanuel Kant", "Kant", "1724–1804", "German philosopher whose critical philosophy set the limits of reason and grounded morality in autonomy.", ["Critique of Pure Reason (1781/1787)", "Groundwork of the Metaphysics of Morals (1785)", "Critique of the Power of Judgment (1790)"], ["leibniz", "hume", "rousseau"], { x:  "Kant lived and taught in Königsberg, East Prussia, all his life. His three Critiques (of Pure Reason, 1781/1787; of Practical Reason, 1788; of the Power of Judgment, 1790) turn on human autonomy, reason giving itself its own laws. His “Copernican revolution” holds that objects must conform to our cognition, so that we know things as they appear to us and never things in themselves (transcendental idealism).", src:  "https://plato.stanford.edu/entries/kant/", srcName:  "Stanford Encyclopedia of Philosophy" }],

  ["nietzsche", "Friedrich Nietzsche", "Nietzsche", "1844–1900", "German philologist and critic of morality, truth and Christianity.", ["The Gay Science (1882)", "Thus Spoke Zarathustra (1883–85)", "Beyond Good and Evil (1886)", "On the Genealogy of Morality (1887)"], ["schopenhauer"], { x:  "Nietzsche was appointed professor of classical philology at Basel in 1869, at 24, and collapsed in Turin in January 1889, spending his last years in his family’s care. His best-known books include Thus Spoke Zarathustra (1883–85), Beyond Good and Evil (1886) and On the Genealogy of Morality (1887). Their themes are the critique of morality, the death of God, the will to power, eternal recurrence and perspectivism; The Will to Power was assembled after his death by his sister from his notebooks.", src:  "https://plato.stanford.edu/entries/nietzsche/", srcName:  "Stanford Encyclopedia of Philosophy" }],

  async (fd) => {

    const lines = fd.get("sections").split("\n").map((l) => l.trim()).filter(Boolean), used = new Set();
    const byLabel = lines.map((label) => { const p = old.find((s) => s.label === label && !used.has(s.id)); if (p) used.add(p.id); return p; });
    const sections = lines.map((label, k) => {
      let prev = byLabel[k];
      if (!prev && lines.length === old.length && old[k] && !used.has(old[k].id)) { prev = old[k]; used.add(prev.id); }

    const gone = new Set(old.map((s) => s.id).filter((x) => !sections.some((s) => s.id === x)));
    const blocks = id && t.hasContent && gone.size ? await loadContent(tid) : null;
    if (blocks && blocks.some((b) => b.s && gone.has(b.s))) {
      const next = blocks.map((b) => { if (!b.s || !gone.has(b.s)) return b; const c = { ...b }; delete c.s; if (c.st === "chapter") c.st = "heading"; return c; });
      if (idb) await idbTx(["content", "texts"], (st) => { st("content").put(next, tid); st("texts").put(data, tid); });
      S.content.set(tid, next); S.texts.set(tid, data); render();
    } else await put("texts", tid, data);
    if (!S.texts.has(tid)) S.texts.set(tid, data);
    if (!id) return () => go({ screen: "text", textId: tid });
  },
  (root) => {
    const getT = () => ({ title: $("#f-title", root).value.trim() || "Untitled", author: $("#f-author", root).value.trim() });
    wireCover(root, cover, getT);

        else if (cover.auto) { cover.blob = undefined; cover.auto = false; cover.show(undefined); }

}

// Reading settings live on this device only.
const RS = { fs: 20, lh: "normal", w: "medium", tone: "app", mn: "show", flow: "scroll", turn: "flip", align: "justify", bars: "hide", awake: "on", sum: "ask" };
try { Object.assign(RS, JSON.parse(localStorage.getItem("mg-reader") || "{}")); const old = +localStorage.getItem("mg-fs"); if (old && !localStorage.getItem("mg-reader")) RS.fs = old; } catch {}
const LH = { compact: 1.45, normal: 1.62, airy: 1.85 }, MEASURE = { narrow: "30em", medium: "34em", wide: "40em" };
function applyFs() {
  const book = $("#book"), reader = $("#reader");
  book.style.setProperty("--fs", RS.fs + "px");
  book.style.setProperty("--lh", LH[RS.lh] || 1.62);
  book.style.setProperty("--measure", MEASURE[RS.w] || "34em");
  book.classList.toggle("hide-mn", RS.mn === "hide"); R.ver = (R.ver || 0) + 1;
  reader.classList.toggle("paged-reader", RS.flow === "pages");
  reader.classList.toggle("justify", RS.align !== "left");
  reader.classList.toggle("immersive", RS.flow === "pages" && RS.bars !== "show"); reader.classList.remove("bars-on");
  reader.classList.remove("tone-paper", "tone-sepia", "tone-night");
  if (RS.tone !== "app") reader.classList.add("tone-" + RS.tone);
  layoutPages(); syncThemeColor();
}
// The phone's status bar takes the colour of the page while reading, and the app's colours elsewhere.
const THEME0 = [...document.querySelectorAll('meta[name="theme-color"]')].map((m) => [m, m.content]);
function syncThemeColor() {
  const c = S.screen === "reader" ? getComputedStyle($("#reader")).getPropertyValue("--paper").trim() : "";
  for (const [m, v] of THEME0) m.content = c || v;
}
// Swipe pages, toolbar hidden while reading: a tap in the middle of the page shows it over the top lines, and a page turn
// or another tap puts it away. The page itself keeps its size, so the text never moves.
const immersive = () => isPaged() && RS.bars !== "show";

/* moving through the book: a slider over its whole length with the chapters marked, and a page number to go to */
const navBlock = (v) => { const want = (v / 1000) * R.cum[R.blocks.length]; let lo = 0, hi = R.blocks.length - 1; while (lo < hi) { const m = (lo + hi + 1) >> 1; if (R.cum[m] <= want) lo = m; else hi = m - 1; } return lo; };
function showNav(on) {
  const nav = $("#rnav"); if (!R.blocks) on = false;
  nav.hidden = !on; if (!on) return;
  const total = R.cum[R.blocks.length] || 1, ticks = [];
  R.blocks.forEach((b, i) => { if (b.s && !b.stj && roleOf(b) === "chapter") ticks.push(`<i style="left:${((100 * R.cum[i]) / total).toFixed(2)}%"></i>`); });
  $("#rnav-ticks").innerHTML = ticks.join("");
  const t = S.texts.get(R.tid); $("#rnav-pp").hidden = !(t && t.source && t.source.kind === "PDF");
  syncNav();
}
function navLabel(i) {
  i = contentAt(i); const names = new Map((S.texts.get(R.tid)?.sections || []).map((s) => [s.id, s.label])), ch = names.get(R.secAt[i]);
  return [R.pageAt[i] ? loc(R.pageAt[i]) : "", ch || ""].filter(Boolean).join(" · ");
}
function syncNav(i = currentBlock()) {
  const total = R.cum[R.blocks.length] || 1, v = Math.round((1000 * R.cum[i]) / total);
  if (!R.dragging) $("#rnav-r").value = v;
  $("#rnav-where").textContent = navLabel(i); $("#rnav-pct").textContent = `${Math.round(v / 10)}%`;
}
// The first block of a printed page: an exact label (roman numerals too), or the last numbered page before the number.
function blockForPage(want) {
  want = String(want || "").trim().toLowerCase(); if (!want) return -1;
  const B = R.blocks; let best = -1, bestN = -Infinity;
  for (let i = 0; i < B.length; i++) {
    if (B[i].k !== "pg") continue;
    const x = String(B[i].x).trim().toLowerCase(); if (x === want) return i;
    const n = parseInt(x, 10); if (/^\d+$/.test(want) && n <= +want && n > bestN) { best = i; bestN = n; }

/* the screen stays on while you read: a slow page shouldn't let the phone lock. Let go after five minutes without a touch. */
const WAKE = { lock: null, t: 0, asking: false };

/* the printed page: the PDF a book was made from, kept on this device (store "files", never backed up), shown a page at a

// Keep the PDF of a book already in the library: it is read once more so its pages can be matched to the book's.

/* notes to the text: a tapped note number shows its note. Footnotes are found near the number; endnotes at the back of the
   book, in the run of numbered notes that belongs to this chapter. */
const NOTE_START = /^\s*(?:(\d{1,3})(?:[.)]\s*|\s+)|([⁰¹²³⁴⁵⁶⁷⁸⁹]{1,3})\s*)(?=\S)/u;
const supNum = (m) => +[...m].map((c) => "⁰¹²³⁴⁵⁶⁷⁸⁹".indexOf(c)).join("");
function noteRuns() {
  if (R.noteRuns && R.noteRunsOf === R.blocks) return R.noteRuns;
  const B = R.blocks, starts = [], runs = [];
  B.forEach((b, k) => {
    if (b.k === "pg" || b.k === "h" || b.k === "front" || isHidden(b) || isTitleRole(roleOf(b)) || b.stj) return;
    const m = NOTE_START.exec(plain(b.x || "")); if (!m) return;
    starts.push({ k, n: m[1] ? +m[1] : supNum(m[2]), fn: b.k === "fn" });
  });
  // endnotes: numbered paragraphs counting up from 1, a run for each chapter
  let run = null;
  for (const st of starts) {
    if (st.fn) continue;
    if (st.n === 1) { run = { at: st.k, notes: new Map([[1, st.k]]) }; runs.push(run); }
    else if (run && st.n > Math.max(...run.notes.keys()) && st.n <= Math.max(...run.notes.keys()) + 3) run.notes.set(st.n, st.k);
  }
  R.noteRuns = { starts, runs: runs.filter((r) => r.notes.size >= 2) }; R.noteRunsOf = B;
  return R.noteRuns;
}
// The note numbered n for a reference in block i: [best block, other candidates].
function findNote(i, n) {

  const all = starts.filter((st) => st.n === n).map((st) => st.k);
  // a footnote: on this printed page or the next, just after the reference
  let pgs = 0;
  for (let k = i + 1; k < B.length && pgs < 3; k++) { if (B[k].k === "pg") pgs++; if (B[k].k === "fn" && all.includes(k)) return [k, all]; }
  for (let k = i - 1; k >= Math.max(0, i - 12); k--) if (B[k].k === "fn" && all.includes(k)) return [k, all];
  // an endnote: the chapters whose text has note numbers, in order, and the runs of notes after the text
  // (a chapter with footnotes keeps its notes on its own pages, so it isn't one of them)
  const withFn = new Set(); B.forEach((b, k) => { if (b.k === "fn") withFn.add(R.secAt[k] || ""); });
  const chapters = []; let lastRef = 0;
  B.forEach((b, k) => { const c = R.secAt[k] || ""; if (b.k !== "fn" && !withFn.has(c) && sup.test(b.x || "")) { if (chapters[chapters.length - 1] !== c) chapters.push(c); lastRef = k; } });

  if (label.length >= 4) for (const r of after) for (let k = r.at - 1; k >= Math.max(0, r.at - 4); k--) { const t = norm(B[k].x || ""); if (t && (t.includes(label) || (t.length >= 4 && label.includes(t)))) return [r.notes.get(n), all]; }

  const tail = runs.filter((r) => r.at > lastRef), m = chapters.indexOf(R.secAt[i] || "");

  if (m >= 0) for (const r of after) for (let k = r.at - 1; k >= Math.max(0, r.at - 3); k--) {

}

  const textAt = (j) => { let x = plain(B[j].x || ""); for (let q = j + 1; q < B.length && q < j + 4 && (B[q].k === "c" || (B[q].k === "pg" && B[q + 1] && B[q + 1].k === "c")); q++) if (B[q].k === "c") x += glueAfter(x) + plain(B[q].x || ""); return x; };

  if (b.dataset.dmove) { const [k, dir] = b.dataset.dmove.split(":").map(Number); return moveDraftItem(S.draftId, k, dir); }
  if (b.dataset.dremove) return removeDraftItem(S.draftId, +b.dataset.dremove);
  if (b.dataset.dedit) return draftTextSheet(S.draftId, +b.dataset.dedit);
  // search all books
  if (b.id === "searchall") return go({ screen: "concord" });
  if (b.id === "searchbooks") return go({ screen: "concord", q: S.q.trim() });
  if (b.dataset.conc) return go({ screen: "reader", textId: b.dataset.conc, at: +b.dataset.at, flash: true, find: CONC.q });
  if (b.dataset.concmore) { const id = b.dataset.concmore; if (CONC.open.has(id)) CONC.open.delete(id); else CONC.open.add(id); return drawConcord(); }
  if (b.id === "exportbtn") return exportPanel();
  // comparisons
  if (b.id === "opencompares") return go({ screen: "compares" });
  if (b.id === "newcmp") return cmpNewSheet();
  if (b.dataset.cmp) return go({ screen: "compare", cmpId: b.dataset.cmp });
  if (b.dataset.cell) return cellSheet(S.cmpId, b.dataset.cell);
  if (b.dataset.cside) return sideSheet(S.cmpId, b.dataset.cside);
  if (b.id === "cmp-addside") return sideSheet(S.cmpId, null);
  if (b.id === "cmp-addrow") return rowSheet(S.cmpId, null);
  if (b.dataset.crow) return rowSheet(S.cmpId, b.dataset.crow);
  if (b.dataset.cmove) { const [rid, dir] = b.dataset.cmove.split(":"); return moveCmpRow(S.cmpId, rid, +dir); }
  if (b.dataset.cmode) { cmpMode = b.dataset.cmode === "table" ? "table" : "rows"; try { localStorage.setItem("mg-cmpview", cmpMode); } catch {} return render(); }
  if (b.id === "cmp-gaps") { S.cmpGaps = !S.cmpGaps; return render(); }
  if (b.id === "cmp-verdict") return verdictSheet(S.cmpId);
  if (b.id === "cmp-export") return cmpExportPanel(S.cmpId);
  if (b.id === "cmp-more") return cmpMore(S.cmpId);
});
document.addEventListener("change", (e) => {
  if (e.target.id === "restore") { const f = e.target.files && e.target.files[0]; e.target.value = ""; if (f) importBackup(f); return; }
  if (S.screen !== "text") return;
  const t = S.texts.get(S.textId);
  if (e.target.id === "status" && t) put("texts", S.textId, { ...t, status: e.target.value, updatedAt: Date.now() }).catch(() => {});
  if (e.target.dataset && e.target.dataset.tick && t) {
    const sections = t.sections.map((s) => (s.id === e.target.dataset.tick ? { ...s, done: e.target.checked } : s));
    put("texts", S.textId, { ...t, sections, updatedAt: Date.now() }).catch(() => {});
  }
});
document.addEventListener("toggle", (e) => {
  const d = e.target;
  if (d && d.matches && d.matches("details.branch")) { if (d.open) S.bOpen.add(d.dataset.branchId); else S.bOpen.delete(d.dataset.branchId); return; }
  if (d && d.matches && d.matches("details.term")) { if (d.open) S.gOpen.add(d.dataset.termId); else S.gOpen.delete(d.dataset.termId); }
}, true);
let qTimer;
document.addEventListener("input", (e) => {
  if (e.target.id !== "q" && e.target.id !== "tq" && e.target.id !== "gq" && e.target.id !== "pq" && e.target.id !== "rq") return;
  const key = e.target.id; S[key] = e.target.value;
  clearTimeout(qTimer); qTimer = setTimeout(() => { render(); const el = $("#" + key); if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); } }, 180);
});

/* ---------- boot ---------- */
render();
(async () => {
  try {
    idb = await idbOpen();
    S.texts = await idbAll("texts");
    S.notes = await idbAll("notes");
    S.covers = await idbAll("covers");
    S.terms = await idbAll("terms");
    S.drafts = await idbAll("drafts");
    S.compares = await idbAll("compares");
    S.mode = "ready";
  } catch { idb = null; S.mode = "local"; }
  render();
  try { if (navigator.storage && navigator.storage.persist) S.persisted = await navigator.storage.persist(); } catch {}
})();
if ("serviceWorker" in navigator && location.protocol === "https:") {
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}
</script>
