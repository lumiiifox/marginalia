<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marginalia</title>
<meta name="description" content="A personal reading log and reader.">
<meta name="theme-color" content="#e4d8c4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#2a2019" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Marginalia">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&family=Alegreya+SC:wght@500&family=Alegreya+Sans:wght@400;500;700&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div class="wrap" id="main"></div>
<div id="reader" hidden>
  <header class="rbar">
    <button class="btn ghost ricon" id="rback" aria-label="Back to the text's page">←</button>
    <div class="rtitle" id="rtitle"></div>
    <button class="btn ghost rpg" id="rpg" aria-label="Move through the book"></button>
    <button class="btn ghost ricon" id="rmark" aria-label="Bookmark this page" aria-pressed="false"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M7 3.5h10v17l-5-3.8-5 3.8z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg></button>
    <button class="btn ghost ricon" id="rfind" aria-label="Find in this book"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M15 15l5 5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button>
    <button class="btn ghost ricon raa" id="raa" aria-label="Reading settings">Aa</button>
    <button class="btn ghost ricon" id="rtoc" aria-label="Contents and bookmarks"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M5 6.5h14M5 12h14M5 17.5h9" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button>
  </header>
  <article class="book" id="book"></article>
  <div class="flip" id="flip" aria-hidden="true"><div class="book" id="flipbook"></div><div class="flipshade" id="flipshade"></div></div>
  <div class="undershade" id="undershade" aria-hidden="true"></div>
  <div class="rfoot" id="rfoot" aria-hidden="true"></div>
  <div class="rnav" id="rnav" hidden>
    <div class="rnav-lab"><span id="rnav-where"></span><span id="rnav-pct"></span></div>
    <div class="rnav-notes" id="rnav-notes" hidden></div>
    <div class="rnav-track"><div class="rnav-ticks" id="rnav-ticks"></div><input type="range" id="rnav-r" min="0" max="1000" step="1" aria-label="Move through the book"></div>
    <div class="rnav-row"><label class="rnav-go">Go to page <input id="rnav-pg" autocomplete="off" enterkeyhint="go" aria-label="Page number, or the other edition's: its name and page, such as Minuit 34"></label><button class="btn ghost" id="rnav-pp" hidden>Printed page</button><button class="btn ghost" id="rnav-pair" hidden>In the original</button><button class="btn ghost" id="rnav-close">Done</button></div>
  </div>
  <div class="rtrail" id="rtrail" hidden></div>
  <section class="pin" id="pin" aria-label="Pinned passage" hidden></section>
</div>
<div class="selcarry" id="selcarry" hidden></div>
<div class="selbar" id="selbar" hidden><button class="btn" id="sellook" hidden>Look up</button><button class="btn" id="seledit">Edit</button><button class="btn" id="selhl">Highlight</button><button class="btn" id="selmore" hidden>Continue on next page</button><button class="btn" id="selpin">Pin</button><button class="btn primary" id="selsave">Add a note</button></div>
<div id="sheetroot"></div>
<div class="toast" id="toast" role="status" hidden></div>

<script src="data/glossary.js"></script>
<script src="data/thinkers.js"></script>
<script src="data/branches.js"></script>
<script src="data/recommendations.js"></script>
<script src="js/core.js"></script>
<script src="js/storage.js"></script>
<script src="js/cite.js"></script>
<script src="js/import.js"></script>
<script src="js/library.js"></script>
<script src="js/writing.js"></script>
<script src="js/study.js"></script>
<script src="js/reference.js"></script>
<script src="js/sheets.js"></script>
<script src="js/wikisource.js"></script>
<script src="js/bookmenu.js"></script>
<script src="js/reader.js"></script>
<script src="js/structure.js"></script>
<script src="js/discovery.js"></script>
<script src="js/cloud-backup.js"></script>
<script src="js/boot.js"></script>
</body>
</html>
